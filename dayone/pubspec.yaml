name: dayone
description: DayOne - Identity-driven habit app based on dan cok's philosophy

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  
  # Routing
  go_router: ^13.0.0
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI
  google_fonts: ^6.2.0
  confetti: ^0.7.0
  
  # Notifications（flutter_local_notifications 不支持 Web，会导致 Web 编译崩溃，已改为桩实现；需要移动端推送时再加回依赖并恢复实现）
  shared_preferences: ^2.2.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.0
  
  # Icons (pub.dev 当前最新 0.563.x，原 ^0.300.0 无匹配版本)
  lucide_flutter: ^0.563.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  generate: true

  # 有字体文件后取消注释，并确保存在 dayone/assets/fonts/DayOneIcons.ttf
  # fonts:
  #   - family: DayOneIcons
  #     fonts:
  #       - asset: assets/fonts/DayOneIcons.ttf

flutter_intl:
  enabled: true
